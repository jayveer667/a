<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylish Header</title>
 
</head>
<style>
/* General Reset */
* {margin:0; padding:0; box-sizing:border-box;}
body {font-family: 'Poppins', sans-serif; background:#111; color:#fff;}

/* Header */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#222;
  padding:15px 30px;
  box-shadow:0 0 15px rgba(0,255,255,0.3);
}
.logo {
  font-size:24px;
  font-weight:bold;
  color:#00fff7;
}
nav ul {
  list-style:none;
  display:flex;
}
nav ul li {
  position:relative;
}
nav ul li a {
  color:#fff;
  text-decoration:none;
  padding:10px 15px;
  display:block;
}
nav ul li a:hover {
  background:#333;
  border-radius:5px;
  color:#ff9800;
}

/* Dropdown */
.dropdown {
  position:absolute;
  top:100%;
  left:0;
  background:#222;
  display:none;
  flex-direction:column;
  min-width:150px;
  box-shadow:0 0 10px rgba(0,0,0,0.5);
}
.dropdown li a {
  padding:10px;
}
nav ul li:hover .dropdown {
  display:flex;
}

/* Buttons */
.header-buttons .btn {
  margin-left:10px;
  padding:8px 15px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}
.login-btn {
  background:#00fff7;
  color:#111;
}
.signup-btn {
  background:#ff9800;
  color:#fff;
}
.login-btn:hover {background:#00c4b7;}
.signup-btn:hover {background:#e67e22;}
</style>
<body>
  <!-- Header -->
  <header>
    <div class="logo">MyStore</div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li>
          <a href="#">Products ▼</a>
          <ul class="dropdown">
            <li><a href="#">Mobiles</a></li>
            <li><a href="#">Laptops</a></li>
            <li><a href="#">Fashion</a></li>
            <li><a href="#">Accessories</a></li>
          </ul>
        </li>
        <li>
          <a href="#">Services ▼</a>
          <ul class="dropdown">
            <li><a href="#">Customer Care</a></li>
            <li><a href="#">Warranty</a></li>
            <li><a href="#">Repairs</a></li>
          </ul>
        </li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <div class="header-buttons">
      <button class="btn login-btn">Login</button>
      <button class="btn signup-btn">Sign Up</button>
    </div>
  </header>

  <script>
    // Example JS: Button actions
document.querySelector(".login-btn").addEventListener("click", () => {
  alert("Login button clicked!");
});
document.querySelector(".signup-btn").addEventListener("click", () => {
  alert("Signup button clicked!");
});

  </script>
</body>
</html>
